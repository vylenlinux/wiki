stages:
    - build
    - deploy

build:
    image: node:22-alpine
    stage: build

    script:
        - npm install
        - npm run build

    artifacts:
        paths:
            - dist/

        expire_in: 1 hour

pages:
    stage: deploy

    script:
        - mkdir -p public
        - cp -r dist/* public/

    artifacts:
        paths:
            - public/

        expire_in: 30 days
